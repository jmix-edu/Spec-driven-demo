plugins {
    id 'io.jmix' version '3.0.3'
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '3.0.3'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = 'https://global.repo.jmix.io/repository/public'
    }
    maven {
        url = 'https://global.repo.jmix.io/repository/premium'
        credentials {
            username = rootProject['premiumRepoUser']
            password = rootProject['premiumRepoPass']
        }
    }
}

dependencies {
    implementation 'io.jmix.dynmodel:jmix-dynmodel-flowui-starter'
    implementation 'io.jmix.dynmodel:jmix-dynmodel-starter'

    implementation 'io.jmix.aitools:jmix-aitools-flowui-data-starter'
    implementation 'io.jmix.aitools:jmix-aitools-flowui-starter'
    implementation 'io.jmix.aitools:jmix-aitools-starter'
    // model provider for AI Tools: OpenRouter through its OpenAI-compatible API
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'io.jmix.datatools:jmix-datatools-starter'
    implementation 'io.jmix.datatools:jmix-datatools-flowui-starter'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.vaadin:vaadin-dev'

    runtimeOnly 'org.hsqldb:hsqldb'
    // prod profile database
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

// production build (-Pvaadin.productionMode=true bootJar): keep the Vaadin dev tooling out of the JAR;
// development builds are unaffected
if (project.findProperty('vaadin.productionMode') == 'true') {
    configurations.implementation {
        exclude group: 'com.vaadin', module: 'vaadin-dev'
    }
}

test {
    useJUnitPlatform()
}

idea {
    module {
        excludeDirs.addAll(files '.jmix', 'node_modules', 'src/main/frontend/generated/', 'src/main/bundles')
    }
}

vaadin {
    optimizeBundle = false
    productionMode = false
}
