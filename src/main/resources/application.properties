spring.application.name=booking
# no active profile -> dev (IDE runs, plain bootRun); the container sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Local development database (embedded HSQLDB file, no real secret). Kept here, not in the dev profile,
# because Jmix Studio reads the main data store connection from this file. The prod profile overrides
# all three from environment variables.
main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/booking
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/booking/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/booking/menu.xml
jmix.ui.composite-menu=true

jmix.core.available-locales=en

# AI Tools: OpenRouter through its OpenAI-compatible API.
# The key is read from the environment and never stored here.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.model=z-ai/glm-5.2
# personal data is not exposed to the external model
jmix.aitools.dataload.exclude-entities=User

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn
