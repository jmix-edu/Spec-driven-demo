# Production profile: everything environment-specific comes from environment variables.
# No defaults on purpose - the application does not start if one is missing.
main.datasource.url=${DB_URL}
main.datasource.username=${DB_USER}
main.datasource.password=${DB_PASSWORD}

spring.output.ansi.enabled=never

logging.level.root=info
logging.level.io.jmix=warn
logging.level.io.jmix.core.AccessLogger=info
